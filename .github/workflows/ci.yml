# Runs on every push to main and on pull requests: lint, build, type check,
# and unit tests (Vitest).
name: CI

# On main, a successful run also publishes the site to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm install instead of npm ci: npm ci rejects the lock file over optional WASM deps on Linux.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      # The build comes before the type check (it generates next-env.d.ts).
      - run: npm run build
      - run: npm run typecheck
      - run: npx vitest run
      - name: Build for GitHub Pages (/${{ github.event.repository.name }}/)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -rf out && npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: out

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
